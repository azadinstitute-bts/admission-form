        <div><b>Payment verify हो रहा है...</b><br><span style="font-size:11px">यह प्रक्रिया सामान्यतः कुछ सेकंड लेती है।</span></div>

    <a href="https://wa.me/919981957779?text=Namaste%2C%20mujhe%20BTS%20access%20portal%20me%20help%20chahiye." target="_blank" rel="noopener">WhatsApp Support</a>
  </div>

<script>
// APP LINK UPDATE: Play Store / official app URL publish hone ke baad sirf yahan paste karein.
const BTS_STUDENT_APP_URL = 'https://azadinstitute-bts.github.io/bts-student-app/';
const API = 'https://mqorslvouzmrvciubpoq.supabase.co/functions/v1/admission-api';
const STATUS_TIMEOUT_MS = 20000;
const TELEGRAM_RETRY_DELAY_MS = 3000;
const TELEGRAM_MAX_RETRIES = 5;
let statusRequestInFlight = false;
let telegramRetryTimer = null;
let telegramRetryCount = 0;

function getParams() {
  const p = new URLSearchParams(window.location.search);
  return {
    token: p.get('token') || '',
    session: p.get('session') || '',
    admission_id: p.get('admission_id') || '',
  };
}

function saveSession(token) {
  try { sessionStorage.setItem('bts_session', token); } catch(e) {}
}
function getSession() {
  try { return sessionStorage.getItem('bts_session') || ''; } catch(e) { return ''; }
}

function esc(str) {
  return String(str || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function copyText(text) {
  const value = String(text || '');
  if (!value) return;
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(value).catch(() => fallbackCopy(value));
  } else {
    fallbackCopy(value);
  }
}

function fallbackCopy(text) {
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.focus();
  ta.select();
  try { document.execCommand('copy'); } catch(e) {}
  try { ta.remove(); } catch(e) {}
}

async function checkStatus() {
  const p = getParams();
  const querySession = String(p.session || '').trim();
  if (querySession) saveSession(querySession);
  const session = querySession || getSession();

  if (!p.token && !p.admission_id && !session) {
    throw new Error('Access link में verification details नहीं मिलीं। कृपया payment के बाद मिला original link खोलें।');
  }

  const controller = new AbortController();
  const timeout = setTimeout(() => controller.abort(), STATUS_TIMEOUT_MS);
  try {
    const res = await fetch(API, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        action: 'checkPaymentStatus',
        access_token: p.token,
        admission_id: p.admission_id,
        session_token: session,
      }),
      signal: controller.signal,
    });
    let data;
    try { data = await res.json(); }
    catch(e) { throw new Error('Server से invalid response मिला।'); }
    if (!res.ok) throw new Error((data && (data.error || data.message)) || ('Verification failed (' + res.status + ')'));
    if (data && data.ok === false) throw new Error(data.error || data.message || 'Verification failed.');
    return data || {};
  } catch(err) {
    if (err && err.name === 'AbortError') throw new Error('Verification में ज्यादा समय लग रहा है। कृपया Retry करें।');
    throw err;
  } finally {
    clearTimeout(timeout);
  }
}

function clearTelegramRetry() {
  if (telegramRetryTimer) clearTimeout(telegramRetryTimer);
  telegramRetryTimer = null;
}

function scheduleTelegramRetry() {
  clearTelegramRetry();
  if (telegramRetryCount >= TELEGRAM_MAX_RETRIES) {
    const box = document.getElementById('telegramPendingBox');
    if (box) box.innerHTML = '⏳ Telegram invite तैयार होने में थोड़ा समय लग रहा है। नीचे दिए button से दोबारा check करें।';
    const btn = document.getElementById('telegramRetryBtn');
    if (btn) btn.style.display = 'block';
    return;
  }
  telegramRetryCount += 1;
  let remaining = Math.ceil(TELEGRAM_RETRY_DELAY_MS / 1000);
  const countEl = document.getElementById('retryCountdown');
  if (countEl) countEl.textContent = remaining;
  const interval = setInterval(() => {
    remaining -= 1;
    const el = document.getElementById('retryCountdown');
    if (el) el.textContent = Math.max(remaining, 0);
    if (remaining <= 0) clearInterval(interval);
  }, 1000);
  telegramRetryTimer = setTimeout(refreshTelegramStatus, TELEGRAM_RETRY_DELAY_MS);
}

async function refreshTelegramStatus() {
  if (statusRequestInFlight) return;
  statusRequestInFlight = true;
  const btn = document.getElementById('telegramRetryBtn');
  if (btn) { btn.disabled = true; btn.textContent = 'Checking…'; }
  try {
    const data = await checkStatus();
    if (data.access_session_token) saveSession(data.access_session_token);
    if (data.verified === true || data.payment_state === 'VERIFIED') {
      const approved = String(data.telegram_join_status || '').toUpperCase() === 'APPROVED';
      if (data.telegram_invite_link || approved) {
        telegramRetryCount = 0;
        clearTelegramRetry();
        renderVerified(data);
      } else {
        const box = document.getElementById('telegramPendingBox');
        if (box) box.innerHTML = '⏳ Telegram invite link generate हो रहा है… <span id="retryCountdown">3</span> seconds में फिर check होगा।';
        scheduleTelegramRetry();
      }
    }
  } catch(err) {
    const box = document.getElementById('telegramPendingBox');
    if (box) box.textContent = 'Telegram link check नहीं हो पाया। नीचे Retry करें।';
    if (btn) btn.style.display = 'block';
  } finally {
    statusRequestInFlight = false;
    if (btn) { btn.disabled = false; btn.textContent = '🔄 Check Telegram Link'; }
  }
}

function renderVerified(data) {
  const params = getParams();
  const inviteLink = data.telegram_invite_link || '';
  const hasWhatsApp = data.group_whatsapp_link || '';
  const joinStatus = String(data.telegram_join_status || '').toUpperCase();
  const isApproved = joinStatus === 'APPROVED';
  const appCode = data.access_code_consumed ? '' : String(data.app_access_code || '');
  const appMobile = String(data.mobile || '').replace(/\D/g, '').slice(-10);
  const appIsLive = /^https?:\/\//i.test(BTS_STUDENT_APP_URL);

  let tgSection = '';
  if (inviteLink) {
    if (isApproved) {
      tgSection = `<div class="notice notice-success">✅ आप Telegram group में join हो चुके हैं।</div>`;
    } else {
      tgSection = `
        <div class="notice notice-info">🔒 यह private link केवल आपके admission के लिए है। इसे share न करें।</div>
        <a class="btn btn-telegram" href="${esc(inviteLink)}" target="_blank" rel="noopener">📲 Join Telegram Group</a>
        <div class="notice notice-warn" style="margin-top:8px">⏱️ Invite link 24 घंटे में expire हो सकता है।</div>`;
    }
  } else {
    tgSection = `<div class="notice notice-info" id="telegramPendingBox">⏳ Telegram invite link generate हो रहा है…<br><span id="retryCountdown">3</span> seconds में फिर check होगा।</div>
      <button class="btn" id="telegramRetryBtn" type="button" style="display:none;background:linear-gradient(135deg,#1554c0,#0b3c91);color:white">🔄 Check Telegram Link</button>`;
  }

  let waSection = '';
  if (hasWhatsApp) {
    waSection = `
      <div class="accessSection">
        <div class="section-title">💬 WhatsApp Group <span style="font-size:10px;color:#64748b">Full Course access</span></div>
        <a class="btn btn-whatsapp" href="${esc(hasWhatsApp)}" target="_blank" rel="noopener">💬 Join WhatsApp Group</a>
        <div class="notice notice-warn">WhatsApp group link share न करें।</div>
      </div>`;
  }

  const appAccessSection = appCode ? `
    <div class="app-access">
      <div class="app-access-head">
        <div class="app-access-icon">📱</div>
        <div><div class="app-access-title">BTS Student App Login Ready</div><div class="app-access-sub">Payment verified है। आपका mobile और one-time access code तैयार है।</div></div>
      </div>
      <div class="app-publish-pill">${appIsLive ? '● APP LIVE — INSTALL NOW' : '● APP LINK LAUNCHING SHORTLY'}</div>
      <div class="credentialPanel">
        <div class="credential-row"><div class="credential-label">Login Mobile</div><div class="credential-value">${esc(appMobile || data.mobile)}</div></div>
        <div class="credential-row"><div class="credential-label">One-time Access Code</div><div class="credential-value">${esc(appCode)}</div></div>
      </div>
      <div class="copyActions">
        <button class="copy-btn" onclick="copyText('${esc(appMobile || data.mobile)}')">Copy Mobile</button>
        <button class="copy-btn" onclick="copyText('${esc(appCode)}')">Copy Access Code</button>
      </div>
      ${appIsLive ? `<a class="appDownload live" href="${esc(BTS_STUDENT_APP_URL)}" target="_blank" rel="noopener">📲 Download BTS Student App</a>` : `<span class="appDownload">App download link जल्द सक्रिय होगा</span>`}
      <div class="app-note">पहली successful login के बाद code इसी device से bind हो सकता है। Device बदलने पर support से reset कराना पड़ सकता है।</div>
    </div>` : `
    <div class="app-access">
      <div class="app-access-head"><div class="app-access-icon">📱</div><div><div class="app-access-title">Student App Account Active</div><div class="app-access-sub">One-time code पहले उपयोग हो चुका है। Existing device पर login active होना चाहिए।</div></div></div>
      ${appIsLive ? `<a class="appDownload live" href="${esc(BTS_STUDENT_APP_URL)}" target="_blank" rel="noopener">📲 Open / Download BTS Student App</a>` : `<span class="appDownload">App download link जल्द सक्रिय होगा</span>`}
      <div class="app-note">Device reset या login सहायता के लिए नीचे WhatsApp Support उपयोग करें।</div>
    </div>`;

  document.getElementById('contentDiv').innerHTML = `
    <div class="success-badge">
      <div class="success-icon">✓</div>
      <div class="success-title">Payment Verified</div>
      <div class="success-sub">Admission confirmed — आपका instant access तैयार है</div>
    </div>

    <div class="info-grid">
      <div class="info-box"><div class="info-label">Student Name</div><div class="info-value">${esc(data.name)}</div></div>
      <div class="info-box"><div class="info-label">Course / Subject</div><div class="info-value">${esc(data.subject_name)}</div></div>
      <div class="info-box"><div class="info-label">Subscription Plan</div><div class="info-value">${esc(data.plan_name)}</div></div>
      <div class="info-box"><div class="info-label">Amount Paid</div><div class="info-value">₹${esc(data.amount)}</div></div>
    </div>

    <div class="trust-row"><span class="trust-pill">🔒 Secure</span><span class="trust-pill">⚡ Instant Access</span><span class="trust-pill">✅ Auto Verified</span></div>

    ${appAccessSection}

    <div class="accessSection">
      <div class="section-title">📨 Telegram Group</div>
      ${tgSection}
    </div>
    ${waSection}

    <div class="divider"></div>
    <div class="paymentIds" style="font-size:10px;text-align:center">
      Payment ID: ${esc(data.razorpay_payment_id || '')}<br>
      Admission ID: ${esc(data.admission_id)}
    </div>`;

  document.getElementById('loadingDiv').style.display = 'none';
  document.getElementById('contentDiv').style.display = 'block';
  const retryBtn = document.getElementById('telegramRetryBtn');
  if (retryBtn) retryBtn.onclick = refreshTelegramStatus;
  if (!inviteLink && !isApproved) scheduleTelegramRetry();
}

function renderPending() {
  document.getElementById('contentDiv').innerHTML = `
    <div class="success-badge" style="background:#fffaf0;border-color:#f7df9c">
      <div class="success-icon" style="background:#c78608">⌛</div>
      <div class="success-title" style="color:#7a4c00">Payment Verification Pending</div>
      <div class="success-sub" style="color:#8b631b">Payment gateway से confirmation मिलते ही access automatically दिखाई देगा।</div>
    </div>
    <div class="notice notice-info">इस page को बंद किए बिना कुछ सेकंड बाद दोबारा check करें। सफल payment दोबारा करने की जरूरत नहीं है।</div>
    <button class="btn" style="background:linear-gradient(135deg,#1554c0,#0b3c91);color:white" onclick="init()">🔄 Check Payment Again</button>`;
  document.getElementById('loadingDiv').style.display = 'none';
  document.getElementById('contentDiv').style.display = 'block';
}

function renderError(msg) {
  document.getElementById('contentDiv').innerHTML = `
    <div class="success-badge" style="background:#fff6f6;border-color:#fecaca">
      <div class="success-icon" style="background:#b42318">!</div>
      <div class="success-title" style="color:#991b1b">Access Check Failed</div>
      <div class="success-sub" style="color:#a33a3a">${esc(msg)}</div>
    </div>
    <div class="notice notice-info">Payment सफल हुआ हो तो दोबारा payment न करें। Retry करें या WhatsApp Support से संपर्क करें।</div>
    <button class="btn" style="background:linear-gradient(135deg,#1554c0,#0b3c91);color:white" onclick="init()">🔄 Retry Verification</button>`;
  document.getElementById('loadingDiv').style.display = 'none';
  document.getElementById('contentDiv').style.display = 'block';
}

async function init() {
  if (statusRequestInFlight) return;
  statusRequestInFlight = true;
  clearTelegramRetry();
  document.getElementById('loadingDiv').style.display = 'block';
  document.getElementById('contentDiv').style.display = 'none';
  try {
    const data = await checkStatus();
    if (data.access_session_token) saveSession(data.access_session_token);
    if (data.verified === true || data.payment_state === 'VERIFIED') {
      telegramRetryCount = 0;
      renderVerified(data);
    } else if (data.payment_state === 'NOT_FOUND') {
      renderError('Access link invalid है या expire हो गया। Support से संपर्क करें।');
    } else {
      renderPending();
    }
  } catch(err) {
    renderError((err && err.message) || 'Network error');
  } finally {
    statusRequestInFlight = false;
  }
}

init();
</script>
</body>
</html>
