    const res = await fetch(SUPABASE_API, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });

    const data = await res.json();

    // Parse string responses (old Apps Script returned JSON strings)
    if (typeof data === 'string') {
      try { return JSON.parse(data); } catch { return data; }
    }
    return data;

  } catch(err) {
    throw err;
  }
}
function callServerWithTimeout(ms, fn, ...args){
  return new Promise((resolve,reject)=>{
    let done=false;
    const timer=setTimeout(()=>{ if(!done){done=true; reject(new Error('Server response slow.'));}}, ms);
    callServer(fn, ...args).then(r=>{ if(done)return; done=true; clearTimeout(timer); resolve(r); }).catch(err=>{ if(done)return; done=true; clearTimeout(timer); reject(err); });
  });
}

function toDirectImageUrl(url){
  url = String(url || '').trim();
  if(!url) return '';
  let m = url.match(/drive\.google\.com\/file\/d\/([^/]+)/);

  return url;

function showStudentFieldsAfterImageReady(){
  const imgs = Array.from(document.querySelectorAll('#infoImagesSlot img'));

  let done = false;
  let left = imgs.length;
  function finish(){ if(done) return; done = true; showStudentFields(); }
  imgs.forEach(img=>{
    if(img.complete){ left -= 1; return; }
    img.addEventListener('load', ()=>{ left -= 1; if(left <= 0) finish(); }, {once:true});
    img.addEventListener('error', ()=>{ left -= 1; if(left <= 0) finish(); }, {once:true});
  });
  if(left <= 0) finish();
  setTimeout(finish, IMAGE_FIRST_TIMEOUT_MS);
}

function setMobilePaymentReadyState(payUrl, amount){
  activeRazorpayPaymentUrl=String(payUrl||'').trim();
  activeRazorpayPaymentAmount=Number(amount||0);
  var bar=$('mobilePayBar'), cta=$('mobilePayCta'), amt=$('mobilePayAmount'), lbl=$('mobilePayLabel');
  if(bar) bar.classList.add('show');
  if(amt) amt.textContent=formatRs(activeRazorpayPaymentAmount);
  if(lbl) lbl.textContent='Admission saved · Payment pending';
  if(cta){

function updateConversionUi(){
  var detailsReady=!!(val('name') && isValidIndianMobileInput(val('mobile')) && val('email') && isValidEmailInput(val('email')));
  var courseReady=!!(val('post') && val('subject') && val('plan'));
  setStepState('stepDetails', detailsReady ? 'done' : 'active');
  setStepState('stepCourse', courseReady ? 'done' : (detailsReady ? 'active' : ''));
  setStepState('stepPayment', courseReady ? 'active' : '');

  // Once the admission has been saved, the sticky CTA must open the already
  // created Razorpay link. It must not call createAdmission again.
  if(activeRazorpayPaymentUrl){
    setMobilePaymentReadyState(activeRazorpayPaymentUrl, activeRazorpayPaymentAmount || getFinalPayableAmount());
    return;
  }

  var bar=$('mobilePayBar'), cta=$('mobilePayCta'), amt=$('mobilePayAmount'), lbl=$('mobilePayLabel');
  var plan=getSelectedPlan();
  if(bar) bar.classList.toggle('show', !!plan);
  if(amt) amt.textContent=plan ? formatRs(getFinalPayableAmount()) : '₹0';
  if(lbl) lbl.textContent=plan ? (getSelectText('plan') || 'Selected plan') : 'Plan चुनें';
  if(cta){
    cta.disabled=!plan;
    cta.textContent=plan ? (isRazorpayEnabled() ? 'Pay Securely' : 'Submit Details') : 'Continue';
    cta.dataset.action=plan ? 'create-admission' : 'select-plan';

  var cta=$('mobilePayCta');
  if(cta){cta.disabled=true; cta.textContent='Opening...';}
  // Same-tab navigation is the most reliable behaviour on Android/iPhone and
  // avoids popup blocking. Razorpay's configured redirect returns the student
  // to the access page after payment.
  window.location.assign(activeRazorpayPaymentUrl);
  setTimeout(function(){
    activeRazorpayPaymentOpening=false;
    if(cta){cta.disabled=false; cta.textContent='Pay Now';}

function formatRs(n){
  var x=Number(n||0);
  if(!Number.isFinite(x)) x=0;
  return '\u20B9'+Math.round(x);
}
function clearAppliedPromo(showMsgFlag){
  appliedPromoQuote=null;
  var summary=$('promoSummary'); if(summary){summary.classList.add('hide'); summary.innerHTML='';}
  var msg=$('promoMsg');
  if(msg){msg.className='fieldHelp'; msg.textContent=showMsgFlag?'Details badal gaye. Promo dobara Apply karein.':'Full Course plans par promo code valid hoga. Mobile number required hai.';}
  updatePaymentAmountDisplay();
}
function updatePaymentAmountDisplay(){
  var plan=getSelectedPlan();
  if(!plan) return;
  var finalAmount=appliedPromoQuote && appliedPromoQuote.final_amount ? appliedPromoQuote.final_amount : plan.amount;
  if($('amountText')) $('amountText').textContent=formatRs(finalAmount);
  var payBtn=$('razorpayPayBtn');
  if(payBtn) payBtn.innerHTML='Pay Securely '+formatRs(finalAmount);
  var mobileAmt=$('mobilePayAmount'); if(mobileAmt) mobileAmt.textContent=formatRs(finalAmount);
  updateConversionUi();
  var summary=$('promoSummary');
  if(summary && appliedPromoQuote && appliedPromoQuote.promo_applied){
    summary.classList.remove('hide');
    summary.innerHTML='<div class="summaryLine"><span>Original</span><b>'+formatRs(appliedPromoQuote.original_amount)+'</b></div>'+
      '<div class="summaryLine"><span>Discount</span><b>'+esc(appliedPromoQuote.discount_percent)+'% (-'+formatRs(appliedPromoQuote.discount_amount)+')</b></div>'+
      '<div class="summaryLine"><span>Payable</span><b>'+formatRs(appliedPromoQuote.final_amount)+'</b></div>';
  }
}
async function applyPromoCode(){
  var btn=document.querySelector('#promoBox button');
  try{
    clearAllFieldErrors();
    var plan=getSelectedPlan();
    if(!plan) throw {message:'Plan select karein.', fieldId:'plan'};
    if(!isRazorpayEnabled()) throw {message:'Promo code sirf Razorpay payment par valid hai.'};
    if(!isValidIndianMobileInput(val('mobile'))) throw {message:'Promo apply karne ke liye valid mobile number required hai.', fieldId:'mobile'};
    var code=String(val('promoCode')||'').trim().toUpperCase();
    if(!code) throw {message:'Promo code enter karein.', fieldId:'promoCode'};
    if(btn){btn.disabled=true; btn.dataset.oldText=btn.innerHTML; btn.innerHTML='Checking...';}
    var raw=await callServerWithTimeout(30000,'validatePromoSafe',{mobile:val('mobile'),plan_id:val('plan'),promo_code:code});
    var res=(typeof raw==='string')?JSON.parse(raw):raw;
    if(!res || res.ok===false) throw {message:(res&&res.error)||'Promo code apply nahi ho paya.', fieldId:'promoCode'};
    appliedPromoQuote=res;
    if($('promoCode')) $('promoCode').value=res.code||code;
    updatePaymentAmountDisplay();
    var msg=$('promoMsg'); if(msg){msg.className='fieldHelp'; msg.textContent=res.message||'Promo code applied.';}
  }catch(err){
    appliedPromoQuote=null;
    updatePaymentAmountDisplay();
    var em=normalizeClientError(err);
    var msg=$('promoMsg'); if(msg){msg.className='fieldErrorText'; msg.textContent=em;}
    if(err && err.fieldId) markInvalidField(err.fieldId, em);
  }finally{
    if(btn){btn.disabled=false; btn.innerHTML=btn.dataset.oldText||'Apply';}
  }
}
function onPlanChange(){
  clearAppliedPromo(false);
  const plan=publicConfig.plans.find(p=>String(p.plan_id)===val('plan')); if(!plan){$('paymentBox').classList.add('hide');updateConversionUi();return}
  $('paymentBox').classList.remove('hide');
  var slot=$('selectedPlanSlot'); if(slot) slot.innerHTML=renderSelectedPlanSummary(plan);
  updatePaymentAmountDisplay();
  const manualBox=$('manualPayBox'), razorBox=$('razorpayPayBox'), submitBtn=$('submitBtn'), promoBox=$('promoBox');
  if(isRazorpayEnabled()){
    if(manualBox) manualBox.classList.add('hide');
    if(razorBox) razorBox.classList.remove('hide');
    if(submitBtn) submitBtn.classList.add('hide');
    if(promoBox) promoBox.classList.remove('hide');
    updateConversionUi();
    return;
  }
  if(manualBox) manualBox.classList.remove('hide');
  if(razorBox) razorBox.classList.add('hide');
  if(submitBtn) submitBtn.classList.remove('hide');
  if(promoBox) promoBox.classList.add('hide');
  $('upiText').textContent=publicConfig.payment.UPI_ID||''; $('receiverText').textContent=publicConfig.payment.RECEIVER_NAME||'';
  const qr=publicConfig.payment.QR_IMAGE_URL||''; $('qrBox').innerHTML = qr ? `<img class="qr" src="${esc(qr)}" alt="Payment QR">` : `<div class="notice">QR image set nahi hai. Pay Now / UPI ID use karein.</div>`;
  updateUpiPayLink();
  updateConversionUi();
}
function onMobileChange(){
  clearAppliedPromo(false);
  updateUpiPayLink();
  var m=$('mobile');
  var help=$('mobileHelp');
  if(!m || !help) return;
  var digits=String(m.value||'').replace(/\D/g,'');
  if(!digits){
    m.classList.remove('fieldInvalid');
    help.className='fieldHelp';
    help.textContent='91 के साथ भी डाल सकते हैं, जैसे 919876543210';
    return;
  }
  if(isValidIndianMobileInput(m.value)){
    m.classList.remove('fieldInvalid');
    help.className='fieldHelp';
    help.textContent='Mobile number ठीक है.';
  }else{
    m.classList.add('fieldInvalid');
    help.className='fieldErrorText';
    help.textContent='कृपया सही 10 digit mobile number डालें. Example: 9876543210';
  }
}
function onScreenshotChange(){
  var f=$('screenshot') && $('screenshot').files ? $('screenshot').files[0] : null;
  var help=$('screenshotHelp');
  var el=$('screenshot');
  if(!help || !el) return;
  if(!f){
    el.classList.remove('fieldInvalid');
    help.className='fieldHelp';
    help.textContent='Payment screenshot/PDF upload करना जरूरी है.';
    return;
  }
  if(f.size>5*1024*1024){
    el.classList.add('fieldInvalid');
    help.className='fieldErrorText';
    help.textContent='Screenshot/PDF 5 MB se chhota hona chahiye.';
  }else if(!isAllowedProofFile(f)){
    el.classList.add('fieldInvalid');
    help.className='fieldErrorText';
    help.textContent='Screenshot JPG/PNG/WEBP/PDF format me upload karein.';
  }else{
    el.classList.remove('fieldInvalid');
    help.className='fieldHelp';
    help.textContent='File selected: '+f.name;
  }
}
function updateUpiPayLink(){
  if(isRazorpayEnabled()) return;
  const payBtn = $('payBtn');
  if(!payBtn || !publicConfig || !publicConfig.payment) return;
  const plan=(publicConfig.plans||[]).find(p=>String(p.plan_id)===val('plan'));
  if(!plan) return;
  const mobile = val('mobile') || 'MOBILE';
  const note=(publicConfig.payment.PAYMENT_NOTE_PREFIX||'BILASPUR_TEST_SERIES')+'_'+mobile;
  payBtn.href=`upi://pay?pa=${encodeURIComponent(publicConfig.payment.UPI_ID||'')}&pn=${encodeURIComponent(publicConfig.payment.RECEIVER_NAME||'BILASPUR TEST SERIES')}&am=${encodeURIComponent(plan.amount||'')}&cu=INR&tn=${encodeURIComponent(note)}`;
  const help=$('paymentNoteHelp'); if(help) help.innerHTML='Payment note/remark me apna latest mobile number जरूर लिखें: <b>'+esc(mobile)+'</b>';
}
function isValidIndianMobileInput(mobile){
  const digits=String(mobile||'').replace(/\D/g,'');
  const n=(digits.length===12 && digits.startsWith('91')) ? digits.slice(2) : digits;
  return /^[6-9][0-9]{9}$/.test(n) && !/^(\d)\1{9}$/.test(n);
}
function isAllowedProofFile(file){
  if(!file) return false;
  const name=String(file.name||'').toLowerCase();
  const type=String(file.type||'').toLowerCase();
  return ['image/jpeg','image/png','image/webp','application/pdf'].includes(type) || /\.(jpe?g|png|webp|pdf)$/.test(name);
}
function clearSubmitError(){
  var box=$('submitStatusBox');
  if(box) box.innerHTML='';
}
function showSubmitError(message, fieldId){
  var safe=esc(message||'Details check karein.');
  var box=$('submitStatusBox');
  if(box){
    box.innerHTML='<div class="submitErrorBox">'+safe+'</div>';
  }else{
    showMsg('studentMsg',safe,'error');
  }
  if(fieldId) markInvalidField(fieldId, message);
  scrollToSubmitOrField(fieldId);
}
function showSubmitProgress(message, detail){
  var box=$('submitStatusBox');
  if(!box) return;
  box.innerHTML='<div class="submitProgressBox"><b>'+esc(message||'Submit ho raha hai...')+'</b><div>'+esc(detail||'Payment screenshot/PDF upload ho raha hai. Page band na karein.')+'</div><div class="progressBar"><span></span></div></div>';
}
function markInvalidField(id, message){
  var el=$(id);
  if(el) el.classList.add('fieldInvalid');
  if(id==='mobile'){
    var mh=$('mobileHelp');
    if(mh){mh.className='fieldErrorText'; mh.textContent=message || 'कृपया सही 10 digit mobile number डालें.';}
  }
  if(id==='screenshot'){
    var sh=$('screenshotHelp');
    if(sh){sh.className='fieldErrorText'; sh.textContent=message || 'Payment screenshot/PDF upload करना जरूरी है.';}
  }
}
function clearInvalidField(id){
  var el=$(id); if(el) el.classList.remove('fieldInvalid');
}
function clearAllFieldErrors(){
  ['name','mobile','email','post','subject','plan','utr','screenshot','admissionCode'].forEach(clearInvalidField);
  onMobileChange();
  onScreenshotChange();
}
function scrollToSubmitOrField(fieldId){
  var target=(fieldId && $(fieldId)) || $('submitStatusBox') || $('submitBtn');
  if(target && target.scrollIntoView){
    try{target.scrollIntoView({behavior:'smooth',block:'center'});}catch(e){target.scrollIntoView();}
  }
  if(fieldId && $(fieldId) && $(fieldId).focus){try{$(fieldId).focus();}catch(e){}}
}
function requireStudentField(id, message){
  if(!$(id) || !val(id)) throw {message:message, fieldId:id};
}
function isValidEmailInput(v){
  v=String(v||'').trim();
  return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v);
}
function readFileBase64(file){return new Promise((resolve,reject)=>{if(!file){reject(new Error('Payment screenshot/PDF upload करना जरूरी है.'));return} if(file.size>5*1024*1024){reject(new Error('Screenshot/PDF 5 MB se chhota hona chahiye.'));return} if(!isAllowedProofFile(file)){reject(new Error('Screenshot JPG/PNG/WEBP/PDF format me upload karein.'));return} const r=new FileReader(); r.onload=()=>resolve(r.result); r.onerror=()=>reject(new Error('File read failed.')); r.readAsDataURL(file);});}
/* R3 PAYMENT TRANSITION UI helpers
   - showPayOverlay(): full-screen blocking modal during the server call.
     Rotates step messages and guards against reload/back.
   - hidePayOverlay(): cleans up timer + beforeunload listener.
   - renderPayReadyCard(): replaces the form card with a clean payment summary
     and a pulsing CTA. Form fields gone, so no accidental re-submit. */
var PAY_OVERLAY_STEPS = [
  'Saving admission details...',
  'Opening secure Razorpay checkout...',
  'Please wait a moment...'
];
var payOverlayStepIdx = 0;
var payOverlayTimer = null;
var payBeforeUnloadHandler = null;

function attachBeforeUnloadGuard(){
  if(payBeforeUnloadHandler) return;
  payBeforeUnloadHandler = function(e){ e.preventDefault(); e.returnValue = ''; return ''; };
  window.addEventListener('beforeunload', payBeforeUnloadHandler);
}
function detachBeforeUnloadGuard(){
  if(!payBeforeUnloadHandler) return;
  window.removeEventListener('beforeunload', payBeforeUnloadHandler);
  payBeforeUnloadHandler = null;
}

function showPayOverlay(){
  var el = $('payOverlay');
  if(!el){
    var div = document.createElement('div');
    div.id = 'payOverlay';
    div.className = 'payOverlay';
    div.setAttribute('role','dialog');
    div.setAttribute('aria-modal','true');
    div.innerHTML = ''
      + '<div class="payOverlayCard">'
      + '<div class="payOverlayBrand">'
      +   payOverlayLogoHtml()
      +   '<div class="payOverlayBrandText">'
      +     '<div class="payOverlayTitle">BILASPUR TEST SERIES</div>'
      +     '<div class="payOverlayTitleSub">Secure Admission</div>'
      +   '</div>'
      + '</div>'
      + '<div class="payOverlaySpinner"></div>'
      + '<div class="payOverlayStep" id="payOverlayStep">' + esc(PAY_OVERLAY_STEPS[0]) + '</div>'
      + '<div class="payOverlayBar"><span></span></div>'
      + '<div class="payOverlayHint"><b>Please do not close this page.</b><br>Secure Razorpay checkout is opening.</div>'
      + '<div class="payOverlayTrust"><span>&#x1F512; 256-bit SSL</span><span>&middot;</span><span>Razorpay Secured</span></div>'
      + '</div>';
    document.body.appendChild(div);
    el = div;
  }
  el.classList.remove('hide');
  document.body.style.overflow = 'hidden';
  payOverlayStepIdx = 0;
  if(payOverlayTimer) clearInterval(payOverlayTimer);
  payOverlayTimer = setInterval(function(){
    if(payOverlayStepIdx < PAY_OVERLAY_STEPS.length - 1) payOverlayStepIdx++;
    var stepEl = $('payOverlayStep');
    if(stepEl){
      stepEl.style.opacity = '0';
      setTimeout(function(){
        stepEl.innerHTML = esc(PAY_OVERLAY_STEPS[payOverlayStepIdx]);
        stepEl.style.opacity = '1';
      }, 180);
    }
  }, 2400);
  attachBeforeUnloadGuard();
}

function hidePayOverlay(){
  var el = $('payOverlay');
  if(el) el.classList.add('hide');
  document.body.style.overflow = '';
  if(payOverlayTimer){ clearInterval(payOverlayTimer); payOverlayTimer = null; }
}

function getPlanLabelFromForm(){
  try{
    var planSel = $('plan');
    if(planSel && planSel.selectedIndex >= 0){
      var txt = planSel.options[planSel.selectedIndex].text || '';
      return txt.trim();
    }
  }catch(e){}
  return '';
}

function renderPayReadyCard(res, payUrl){
  var planText = getPlanLabelFromForm();
  var nameText = val('name');
  var mobileText = val('mobile');

  var rowsHtml = ''
    + '<div class="paySummaryRow"><span>Admission ID</span><b>' + esc(res.admission_id) + '</b></div>'
    + (nameText   ? '<div class="paySummaryRow"><span>Name</span><b>'   + esc(nameText)   + '</b></div>' : '')
    + (mobileText ? '<div class="paySummaryRow"><span>Mobile</span><b>' + esc(mobileText) + '</b></div>' : '')
    + (res.app_access_code ? '<div class="paySummaryRow"><span>Student App code</span><b id="appAccessCode">' + esc(res.app_access_code) + '</b></div>' : '')
    + (planText   ? '<div class="paySummaryRow"><span>Plan</span><b>'   + esc(planText)   + '</b></div>' : '')
    + (res.promo_code ? '<div class="paySummaryRow"><span>Promo</span><b>' + esc(res.promo_code) + ' - ' + esc(res.promo_discount_percent||0) + '% off</b></div>' : '')
    + (res.promo_code ? '<div class="paySummaryRow"><span>Original</span><b>&#8377;' + esc(res.original_amount||res.amount) + '</b></div>' : '')
    + (res.promo_code ? '<div class="paySummaryRow"><span>Discount</span><b>-&#8377;' + esc(res.promo_discount_amount||0) + '</b></div>' : '')
    + '<div class="paySummaryRow"><span>Amount</span><span class="paySummaryAmt">&#8377;' + esc(res.amount) + '</span></div>';

  var html = ''
    + '<div class="payReadyCard" id="payReadyCard">'
    +   '<div class="payReadyIcon">&#10003;</div>'
    +   '<div class="payReadyTitle">Admission Details Saved</div>'
    +   '<div class="payReadySub">Review your details and complete payment securely on Razorpay.</div>'
    +   '<div class="paySummary">' + rowsHtml + '</div>'
    +   '<a class="payCta" target="_blank" rel="noopener" href="' + esc(payUrl) + '" id="payCtaBtn">'
    +     '<span>&#x1F512;</span> Pay Securely on Razorpay'
    +   '</a>'
    +   '<div class="payCtaSub">UPI, card and net banking supported · Student App credentials और group access payment के बाद तुरंत unlock होंगे</div>'
    +   '<div class="payTrust"><span>&#x1F512; Razorpay secure checkout</span><span>&#x2705; Instant app + group access</span></div>'
    +   '<button class="paySecondary" type="button" id="payCopyBtn">Copy Student App Code</button>'
    + '</div>';

  var formCard = $('formCard');
  if(formCard){
    formCard.insertAdjacentHTML('afterend', html);
    formCard.style.display = 'none';
  } else {
    document.querySelector('.wrap').insertAdjacentHTML('afterbegin', html);
  }

  // Keep one payment link for both CTAs. The sticky Pay Now button now opens
  // this existing link instead of submitting student details a second time.
  setMobilePaymentReadyState(payUrl, Number(res.amount || getFinalPayableAmount()));

  var copyBtn = $('payCopyBtn');
  if(copyBtn){
    copyBtn.onclick = function(){
      try{
        if(navigator.clipboard && navigator.clipboard.writeText){
          navigator.clipboard.writeText(String(res.app_access_code || res.admission_id || ''));
        } else {
          var ta = document.createElement('textarea');
          ta.value = String(res.app_access_code || res.admission_id || '');
          document.body.appendChild(ta); ta.select();
          try{ document.execCommand('copy'); }catch(e){}
          document.body.removeChild(ta);
        }
        copyBtn.innerHTML = '&#10003; Copied';
        setTimeout(function(){ copyBtn.innerHTML = 'Copy Student App Code'; }, 1800);
      }catch(e){}
    };
  }

  var ctaBtn = $('payCtaBtn');
  if(ctaBtn){
    ctaBtn.addEventListener('click', function(){
      // User has tapped pay. Safe to drop the reload-guard now.
      detachBeforeUnloadGuard();
      ctaBtn.style.animation = 'none';
      var sub = ctaBtn.nextElementSibling;
      if(sub) sub.innerHTML = 'Secure payment tab opened. Payment पूरा करें; access portal automatically खुलेगा.';
    });
  }

  try{
    var newCard = $('payReadyCard');
    if(newCard) newCard.scrollIntoView({behavior:'smooth', block:'start'});
  }catch(e){}
}

async function startRazorpayAdmission(){
  const btn=$('razorpayPayBtn');
  try{
    clearSubmitError();
    clearAllFieldErrors();
    if(!publicConfig || publicConfig.fallback || publicConfig.ok === false) throw {message:CONFIG_SLOW_MESSAGE};
    requireStudentField('name','Student name डालना जरूरी है.');
    if(!isValidIndianMobileInput(val('mobile'))) throw {message:'कृपया सही 10 digit mobile number डालें. Example: 9876543210', fieldId:'mobile'};
    requireStudentField('email','Email ID डालना जरूरी है.');
    if(!isValidEmailInput(val('email'))) throw {message:'Valid email ID डालें. Example: student@example.com', fieldId:'email'};
    requireStudentField('post','Varg / Post select करें.');
    requireStudentField('subject','Subject Group select करें.');
    requireStudentField('plan','Subscription Plan select करें.');

    // R3 ACCESS RETURN PATCH:
    // NO blank-tab popups, NO document.write, NO popup doc manipulation.
    // Full-screen overlay during the server call so the wait feels intentional,
    // beforeunload guard so reload/back is not accidental.
    // After success, the form is hidden and a clean pay-ready card is rendered.

    if(btn){btn.disabled=true; btn.dataset.oldText=btn.innerHTML; btn.innerHTML='<span class="spinner"></span> Processing...';}
    showPayOverlay();

    const payload={admissionCode:val('admissionCode'),name:val('name'),mobile:val('mobile'),email:val('email'),district:val('district'),post_id:val('post'),subject_id:val('subject'),plan_id:val('plan'),promo_code:String(val('promoCode')||'').trim().toUpperCase()};
    const raw=await callServerWithTimeout(60000,'createRazorpayAdmissionSafe', payload);
    const res=(typeof raw==='string')?JSON.parse(raw):raw;
    if(!res || res.ok===false){ throw {message:(res&&res.error)||'Razorpay Payment Link create failed.'}; }
    var payUrl = String(res.payment_url || '').trim();
    if(!/^https:\/\/(rzp\.io|razorpay\.com|pages\.razorpay\.com)\//i.test(payUrl)){
      throw {message:'Razorpay Payment Link invalid hai: '+payUrl};
    }

    hidePayOverlay();
    renderPayReadyCard(res, payUrl);

  }catch(err){
    hidePayOverlay();
    detachBeforeUnloadGuard();
    var em=normalizeClientError(err);
    showSubmitError(em, err && err.fieldId ? err.fieldId : '');
    showMsg('studentMsg', esc(em), 'error');
    if(btn){btn.disabled=false; btn.innerHTML=btn.dataset.oldText||'Pay Securely';}
  }
}

async function submitStudentForm(){
  if(isRazorpayEnabled()) return startRazorpayAdmission();
  const btn=$('submitBtn');
  try{
    clearSubmitError();
    clearAllFieldErrors();
    if(!publicConfig || publicConfig.fallback || publicConfig.ok === false) throw {message:CONFIG_SLOW_MESSAGE};
    requireStudentField('name','Student name डालना जरूरी है.');
    if(!isValidIndianMobileInput(val('mobile'))) throw {message:'कृपया सही 10 digit mobile number डालें. Example: 9876543210', fieldId:'mobile'};
    requireStudentField('post','Varg / Post select करें.');
    requireStudentField('subject','Subject Group select करें.');
    requireStudentField('plan','Subscription Plan select करें.');
    requireStudentField('utr','UTR / Transaction ID डालना जरूरी है.');
    const f=$('screenshot').files[0];
    if(!f) throw {message:'Payment screenshot/PDF upload करना जरूरी है.', fieldId:'screenshot'};
    if(!isAllowedProofFile(f)) throw {message:'Screenshot JPG/PNG/WEBP/PDF format me upload karein.', fieldId:'screenshot'};
    if(f.size>5*1024*1024) throw {message:'Screenshot/PDF 5 MB se chhota hona chahiye.', fieldId:'screenshot'};
    if(btn){
      btn.disabled=true;
      const oldText=btn.innerHTML;
      btn.dataset.oldText=oldText;
      btn.innerHTML='<span class="spinner"></span> Submit ho raha hai...';
    }
    showMsg('studentMsg','Form submit ho raha hai. Payment screenshot/PDF upload hone tak page band na karein.','');
    showSubmitProgress('Submit ho raha hai...', 'Payment screenshot/PDF upload ho raha hai. Thoda wait karein.');
    const b64=await readFileBase64(f);
    showSubmitProgress('Screenshot/PDF ready hai.', 'Admission request server par save ho raha hai. Page band na karein.');
    const payload={admissionCode:val('admissionCode'),name:val('name'),mobile:val('mobile'),district:val('district'),post_id:val('post'),subject_id:val('subject'),plan_id:val('plan'),utr:val('utr'),screenshotBase64:b64,screenshotName:f?f.name:'',screenshotMime:f?f.type:''};
    const raw=await callServerWithTimeout(90000,'submitAdmissionSafe', payload);
    const res=(typeof raw==='string')?JSON.parse(raw):raw;
    if(!res || res.ok===false){ throw {message:(res&&res.error)||'Admission submit failed. कृपया details check करके दोबारा try करें.'}; }
    $('formCard').innerHTML=`<div class="notice success"><h2>Admission Request Received</h2><p>${esc(res.message)}</p><p><b>Admission ID:</b> ${esc(res.admission_id)}</p><p class="muted">Is ID ko save kar lein.</p></div>`;
  }catch(err){
    var em=normalizeClientError(err);
    showSubmitError(em, err && err.fieldId ? err.fieldId : '');
    showMsg('studentMsg', esc(em), 'error');
    if(btn){btn.disabled=false; btn.innerHTML=btn.dataset.oldText||'Submit Admission Request';}
  }
}

    <h1>BILASPUR ADMIN</h1><p class="muted">Admission dashboard खोलने के लिए admin password डालें.</p>
    <div id="adminLoginMsg" class="notice hide"></div><label>Admin Password</label><input id="adminPassword" type="password" placeholder="Admin password" onkeydown="if(event.key==='Enter') adminLogin()">

    <div class="card"><h2>Student Page</h2><p class="muted">Yahin se form title, logo, course details image aur support number manage करें.</p><div class="row"><div><label>Form Title</label><input id="set_FORM_TITLE" value="${esc(s.FORM_TITLE||'')}"></div><div><label>Support WhatsApp Number</label><input id="pay_SUPPORT_WHATSAPP" value="${esc(p.SUPPORT_WHATSAPP||'')}"></div></div><label>Logo Image URL</label><input id="set_LOGO_IMAGE_URL" value="${esc(s.LOGO_IMAGE_URL||s.LOGO_URL||'')}" placeholder="Public Drive/Image URL. Blank = BTS fallback"><label>Student Information Image URLs</label><textarea id="set_INFO_IMAGE_URLS" placeholder="One public image URL per line. Blank = no image.">${esc(s.INFO_IMAGE_URLS||'')}</textarea><div class="row3"><div><label>Form Status</label><select id="set_FORM_STATUS"><option ${s.FORM_STATUS==='OPEN'?'selected':''}>OPEN</option><option ${s.FORM_STATUS==='CLOSED'?'selected':''}>CLOSED</option></select></div><div><label>Duplicate Mobile Policy</label><select id="set_DUPLICATE_MOBILE_POLICY"><option ${s.DUPLICATE_MOBILE_POLICY==='BLOCK_SAME_PLAN'?'selected':''}>BLOCK_SAME_PLAN</option><option ${s.DUPLICATE_MOBILE_POLICY==='BLOCK'?'selected':''}>BLOCK</option><option ${s.DUPLICATE_MOBILE_POLICY==='ALLOW'?'selected':''}>ALLOW</option></select></div><div><label>Admission Code Required</label><select id="set_ADMISSION_CODE_REQUIRED"><option ${s.ADMISSION_CODE_REQUIRED==='NO'?'selected':''}>NO</option><option ${s.ADMISSION_CODE_REQUIRED==='YES'?'selected':''}>YES</option></select></div></div><details class="adminSection"><summary><span>Advanced / Legacy manual payment</span><span class="tiny">Normally not needed</span></summary><div class="adminSectionBody"><div class="row"><div><label>UPI ID</label><input id="pay_UPI_ID" value="${esc(p.UPI_ID||'')}"></div><div><label>Receiver Name</label><input id="pay_RECEIVER_NAME" value="${esc(p.RECEIVER_NAME||'')}"></div></div><label>QR Image URL</label><input id="pay_QR_IMAGE_URL" value="${esc(p.QR_IMAGE_URL||'')}"><div class="row"><div><label>Payment Note Prefix</label><input id="pay_PAYMENT_NOTE_PREFIX" value="${esc(p.PAYMENT_NOTE_PREFIX||'')}"></div><div><label>Admission Code</label><input id="set_ADMISSION_CODE" value="${esc(s.ADMISSION_CODE||'')}"></div></div></div></details><p><button id="savePaymentBtn" class="ok" onclick="saveConfig()">Save Student Page</button></p></div>

}

async function saveConfig(){
  const btn = $('savePaymentBtn');
  const oldText = btn ? btn.textContent : '';
  try{
    if(btn){btn.disabled=true; btn.textContent='Saving...';}
    const payment=Object.assign({}, adminData.payment || {});
    payment.UPI_ID=val('pay_UPI_ID') || payment.UPI_ID || '';
    payment.RECEIVER_NAME=val('pay_RECEIVER_NAME') || payment.RECEIVER_NAME || '';
    payment.QR_IMAGE_URL=val('pay_QR_IMAGE_URL') || payment.QR_IMAGE_URL || '';
    payment.PAYMENT_NOTE_PREFIX=val('pay_PAYMENT_NOTE_PREFIX') || payment.PAYMENT_NOTE_PREFIX || '';
    payment.SUPPORT_WHATSAPP=val('pay_SUPPORT_WHATSAPP') || payment.SUPPORT_WHATSAPP || '';
    // R3R1: preserve Razorpay keys when admin saves Setup/Payment settings.
    // Without these, adminSaveConfig() overwrites CONFIG_PAYMENT and Razorpay becomes disabled.
    payment.PAYMENT_PROVIDER=payment.PAYMENT_PROVIDER || 'RAZORPAY';
    payment.RAZORPAY_ENABLED=payment.RAZORPAY_ENABLED || 'TRUE';
    payment.PAYMENT_MODE='LIVE';
    payment.PAYMENT_MODE=payment.PAYMENT_MODE || 'TEST';
    payment.SHOW_GROUP_LINK_AFTER_VERIFIED=payment.SHOW_GROUP_LINK_AFTER_VERIFIED || 'TRUE';
    const settings={FORM_TITLE:val('set_FORM_TITLE')||(adminData.settings||{}).FORM_TITLE||'BILASPUR TEST SERIES ADMISSION FORM',FORM_STATUS:val('set_FORM_STATUS')||(adminData.settings||{}).FORM_STATUS||'OPEN',ADMISSION_CODE_REQUIRED:val('set_ADMISSION_CODE_REQUIRED')||(adminData.settings||{}).ADMISSION_CODE_REQUIRED||'NO',ADMISSION_CODE:val('set_ADMISSION_CODE')||(adminData.settings||{}).ADMISSION_CODE||'AZAD2026',DUPLICATE_MOBILE_POLICY:val('set_DUPLICATE_MOBILE_POLICY')||(adminData.settings||{}).DUPLICATE_MOBILE_POLICY||'BLOCK',INFO_IMAGE_URLS:($('set_INFO_IMAGE_URLS')?val('set_INFO_IMAGE_URLS'):((adminData.settings||{}).INFO_IMAGE_URLS||'')),LOGO_IMAGE_URL:($('set_LOGO_IMAGE_URL')?val('set_LOGO_IMAGE_URL'):((adminData.settings||{}).LOGO_IMAGE_URL||''))};
    const data={posts:collectTable('posts'),subjects:collectTable('subjects'),plans:collectTable('plans'),links:collectTable('links'),promos:collectTable('promos'),payment,settings};
    await callServer('adminSaveConfig',adminPassword,data);
    showToast('Changes saved ✓','success');
    await refreshAdmin({silent:true});
    showToast('Saved and refreshed ✓','success');
  }
  catch(err){showMsg('adminMsg',esc(err.message||err),'error'); showToast('Save failed','error')}
  finally{if(btn){btn.disabled=false; btn.textContent=oldText || 'Save Payment/Settings';}}
}

document.addEventListener('DOMContentLoaded', function(){try{init();}catch(err){const app=document.getElementById('app'); if(app){app.innerHTML='<div class="card"><h1>BILASPUR TEST SERIES ADMISSION FORM</h1><div class="notice error">Page load error: '+esc(err.message||err)+'</div></div>';}}});
</script>
