    /* R7R3 Admin cleanup polish */
    .adminHero{background:linear-gradient(135deg,#0f172a,#1d4ed8);color:white;border-radius:22px;padding:16px;margin:0 0 12px;box-shadow:0 12px 28px rgba(15,23,42,.18)}
    .adminHeroRow{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.adminBrand{display:flex;gap:12px;align-items:center}.adminLogoMini{width:44px;height:44px;border-radius:14px;background:rgba(255,255,255,.16);display:flex;align-items:center;justify-content:center;font-weight:900;border:1px solid rgba(255,255,255,.25)}.adminHero h1{font-size:20px;margin:0}.adminHero .muted{color:#dbeafe}.adminHeroActions{display:flex;gap:8px;flex-wrap:wrap}.adminHeroActions .btn,.adminHeroActions button{margin:0;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);color:white;min-height:38px;padding:8px 11px}.adminHeroActions .primaryMini{background:white;color:#0f172a}

us:16px;padding:10px;margin:12px 0;z-index:12;display:flex;justify-content:space-between;align-items:center;gap:10px;box-shadow:0 10px 26px rgba(15,23,42,.08)}

    @media(max-width:760px){

    /* R3 PAYMENT TRANSITION UI */
    .payOverlay{position:fixed;inset:0;z-index:9998;background:rgba(15,23,42,.78);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:18px;animation:fadeIn .25s ease-out}
    .payOverlay.hide{display:none!important}
    .payOverlayCard{background:white;border-radius:22px;padding:28px 22px;max-width:380px;width:100%;text-align:center;box-shadow:0 24px 60px rgba(0,0,0,.32);animation:popIn .3s ease-out}
    @keyframes fadeIn{from{opacity:0}to{opacity:1}}
    @keyframes popIn{from{opacity:0;transform:scale(.92) translateY(8px)}to{opacity:1;transform:scale(1) translateY(0)}}
    .payOverlayBrand{display:flex;gap:10px;justify-content:center;align-items:center;margin-bottom:18px}
    .payOverlayLogo{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,#1d4ed8,#0f172a);color:white;font-weight:900;display:flex;align-items:center;justify-content:center;font-size:18px}
    .payOverlayBrandText{text-align:left}
    .payOverlayTitle{font-weight:900;font-size:14px;line-height:1.2}
    .payOverlayTitleSub{font-size:11px;color:#64748b;margin-top:2px}
    .payOverlaySpinner{width:56px;height:56px;border:4px solid #e2e8f0;border-top-color:#1d4ed8;border-radius:50%;animation:spin .9s linear infinite;margin:6px auto 16px}
    .payOverlayStep{font-weight:800;font-size:15px;color:#0f172a;min-height:44px;line-height:1.4;transition:opacity .25s;padding:0 6px}
    .payOverlayBar{height:6px;border-radius:999px;background:#e2e8f0;overflow:hidden;margin:14px 0 12px;position:relative}
    .payOverlayBar span{display:block;height:100%;width:35%;border-radius:999px;background:linear-gradient(90deg,#60a5fa,#1d4ed8,#60a5fa);animation:barSlide 1.4s ease-in-out infinite;position:absolute}
    @keyframes barSlide{0%{left:-35%}100%{left:100%}}
    .payOverlayHint{font-size:12.5px;color:#64748b;line-height:1.5;margin-top:8px}
    .payOverlayHint b{color:#b45309}
    .payOverlayTrust{display:flex;gap:6px;justify-content:center;align-items:center;font-size:11px;color:#64748b;margin-top:16px;font-weight:700;flex-wrap:wrap}
    .payOverlayTrust span{display:inline-flex;align-items:center}

    .payReadyCard{text-align:center;padding:26px 18px;border:1px solid var(--border);border-radius:18px;background:white;box-shadow:var(--shadow);margin:12px 0;animation:popIn .35s ease-out}

    .payReadySub{color:#64748b;font-size:14px;margin-bottom:18px;line-height:1.5;max-width:440px;margin-left:auto;margin-right:auto}
    .paySummary{background:#f8fafc;border:1px solid #e2e8f0;border-radius:14px;padding:6px 14px;text-align:left;margin:0 auto 18px;max-width:440px}
    .paySummaryRow{display:flex;justify-content:space-between;gap:8px;padding:10px 0;font-size:14px;border-bottom:1px dashed #e2e8f0}
    .paySummaryRow:last-child{border-bottom:0}
    .paySummaryRow span:first-child{color:#64748b}
    .paySummaryRow b{font-weight:800;color:#0f172a;text-align:right}
    .paySummaryAmt{font-size:18px;color:#1d4ed8;font-weight:900}
    .payCta{display:inline-flex;align-items:center;justify-content:center;gap:10px;background:linear-gradient(135deg,#059669,#1d4ed8);color:white;border:0;border-radius:14px;padding:18px 22px;font-weight:900;font-size:17px;text-decoration:none;width:100%;max-width:440px;box-shadow:0 12px 28px rgba(4,120,87,.32);animation:ctaPulse 1.8s ease-in-out infinite;min-height:60px;cursor:pointer}

    .payCtaSub{font-size:12px;color:#64748b;margin-top:10px}
    .paySteps{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:18px auto 0;max-width:440px}
    .payStep{background:#f8fafc;border:1px solid #e2e8f0;border-radius:12px;padding:10px 8px;font-size:11.5px;color:#0f172a;line-height:1.35;text-align:center}

    .payStep.done{background:#ecfdf5;border-color:#bbf7d0}
    .payTrust{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:18px;font-size:12px;color:#475569;font-weight:700}
    .payTrust span{display:inline-flex;align-items:center;gap:5px;background:#f1f5f9;padding:6px 11px;border-radius:999px;border:1px solid #e2e8f0}
    .paySecondary{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:transparent;color:#1d4ed8;border:1px solid #bfdbfe;border-radius:12px;padding:10px 14px;font-weight:700;font-size:13px;text-decoration:none;margin-top:14px;cursor:pointer;min-height:42px}

    @media(max-width:480px){
      .payOverlayCard{padding:24px 18px}

const CONFIG_FALLBACK_MS = 6500;
const PUBLIC_CONFIG_TIMEOUT_MS = 2500;
const IMAGE_FIRST_TIMEOUT_MS = 6000;
const CONFIG_SLOW_MESSAGE = 'Server slow hai. कृपया Refresh करें या 1 minute बाद try करें.';

function $(id){return document.getElementById(id)}
function esc(v){return String(v ?? '').replace(/[&<>"]/g, s => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[s]))}
function val(id){const el=$(id); return el ? el.value.trim() : ''}
function showMsg(id, msg, type){const el=$(id); if(!el)return; el.className='notice '+(type||''); el.innerHTML=msg; el.classList.remove('hide')}
function showToast(msg, type, ms){
  const t=document.createElement('div');
  t.className='toast '+(type||'');
  t.textContent=msg;
  document.body.appendChild(t);
  setTimeout(()=>t.classList.add('show'),20);
  setTimeout(()=>{t.classList.remove('show'); setTimeout(()=>{try{t.remove()}catch(e){}},260);}, ms||2400);
}
function normalizeClientError(err){
  if(!err) return 'Request failed.';
  if(typeof err === 'string') return err;
  if(err.message) return err.message;
  if(err.details) return err.details;
  try{return JSON.stringify(err)}catch(e){return String(err)}
}
const SUPABASE_API = 'https://mqorslvouzmrvciubpoq.supabase.co/functions/v1/admission-api';

async function callServer(fn, ...args){
  try {
    // Map old Apps Script function names to new API actions
    const actionMap = {
      'getPublicConfig': 'getPublicConfig',
      'createRazorpayAdmissionSafe': 'createAdmission',
      'checkRazorpayAccessStatusSafe': 'checkPaymentStatus',
      'adminGetDataSafe': 'adminGetAdmissions',
      'adminGetAdmissionsOnlySafe': 'adminGetAdmissions',
      'adminUpdateAdmission': 'adminUpdateAdmission',
      'adminSaveConfig': 'adminSaveConfig',
      'adminGetConfig': 'adminGetConfig',
    };

    const action = actionMap[fn] || fn;

    // Build request body based on function
    let body = { action };

    if (fn === 'getPublicConfig') {
      // No extra params needed
    } else if (fn === 'createRazorpayAdmissionSafe') {
      const payload = args[0] || {};
      body = {
        action: 'createAdmission',
        name: payload.name,
        mobile: payload.mobile,
        email: payload.email,
        district: payload.district,
        post_id: payload.post_id,
        subject_id: payload.subject_id,
        plan_id: payload.plan_id,
        admissionCode: payload.admissionCode,
      };
    } else if (fn === 'checkRazorpayAccessStatusSafe') {
      body = {
        action: 'checkPaymentStatus',
        access_token: args[0] || '',
        admission_id: args[1] || '',
        mobile: args[2] || '',
        session_token: args[3] || '',
      };
    } else if (fn === 'adminGetAdmissionsOnlySafe' || fn === 'adminGetDataSafe') {
      body = {
        action: 'adminGetAdmissions',
        password: args[0] || '',
      };
    } else if (fn === 'adminUpdateAdmission') {
      body = {
        action: 'adminUpdateAdmission',
        password: args[0] || '',
        admission_id: args[1] || '',
        status: args[2] || '',
        remark: args[3] || '',
      };
    } else if (fn === 'adminSaveConfig') {
      body = {
        action: 'adminSaveConfig',
        password: args[0] || '',
        data: args[1] || {},
      };
    } else if (fn === 'adminGetConfig') {
      body = {
        action: 'adminGetConfig',
        password: args[0] || '',
      };
    } else {
      // Generic fallback
      body = { action, password: args[0], ...( args[1] || {}) };
    }

    const res = await fetch(SUPABASE_API, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });

    const data = await res.json();

    // Parse string responses (old Apps Script returned JSON strings)
    if (typeof data === 'string') {
      try { return JSON.parse(data); } catch { return data; }
    }
    return data;

  } catch(err) {
    throw err;
  }
}
function callServerWithTimeout(ms, fn, ...args){
  return new Promise((resolve,reject)=>{
    let done=false;
    const timer=setTimeout(()=>{ if(!done){done=true; reject(new Error('Server response slow.'));}}, ms);
    callServer(fn, ...args).then(r=>{ if(done)return; done=true; clearTimeout(timer); resolve(r); }).catch(err=>{ if(done)return; done=true; clearTimeout(timer); reject(err); });
  });
}

function getAdminRememberToken(){
  try{return localStorage.getItem(ADMIN_REMEMBER_STORAGE_KEY)||'';}catch(err){return ''}
}
function saveAdminRememberToken(token){
  token=String(token||'').trim();
  if(!token)return;
  try{localStorage.setItem(ADMIN_REMEMBER_STORAGE_KEY,token);}catch(err){}
  adminRememberToken=token;
}
function clearAdminRememberToken(){
  try{localStorage.removeItem(ADMIN_REMEMBER_STORAGE_KEY);}catch(err){}
  adminRememberToken='';
}
function makeAdminRememberCredential(token){return ADMIN_REMEMBER_CREDENTIAL_PREFIX+String(token||'').trim()}

function toDirectImageUrl(url){
  url = String(url || '').trim();
  if(!url) return '';
  let m = url.match(/drive\.google\.com\/file\/d\/([^/]+)/);
  if(m && m[1]) return 'https://drive.google.com/thumbnail?id=' + encodeURIComponent(m[1]) + '&sz=w1600';
  m = url.match(/[?&]id=([^&]+)/);
  if(url.indexOf('drive.google.com') !== -1 && m && m[1]) return 'https://drive.google.com/thumbnail?id=' + encodeURIComponent(m[1]) + '&sz=w1600';
  return url;
}

function showStudentFieldsAfterImageReady(){

  let done = false;

  function finish(){ if(done) return; done = true; showStudentFields(); }
  imgs.forEach(img=>{
    if(img.complete){ left -= 1; return; }
    img.addEventListener('load', ()=>{ left -= 1; if(left <= 0) finish(); }, {once:true});
    img.addEventListener('error', ()=>{ left -= 1; if(left <= 0) finish(); }, {once:true});
  });

/* R3 PAYMENT TRANSITION UI helpers
   - showPayOverlay(): full-screen blocking modal during the server call.
     Rotates step messages and guards against reload/back.
   - hidePayOverlay(): cleans up timer + beforeunload listener.
   - renderPayReadyCard(): replaces the form card with a clean payment summary
     and a pulsing CTA. Form fields gone, so no accidental re-submit. */
var PAY_OVERLAY_STEPS = [
  'Saving admission details...',
  'Opening secure Razorpay checkout...',
  'Please wait a moment...'
];
var payOverlayStepIdx = 0;
var payOverlayTimer = null;
var payBeforeUnloadHandler = null;

function attachBeforeUnloadGuard(){
  if(payBeforeUnloadHandler) return;
  payBeforeUnloadHandler = function(e){ e.preventDefault(); e.returnValue = ''; return ''; };
  window.addEventListener('beforeunload', payBeforeUnloadHandler);
}
function detachBeforeUnloadGuard(){
  if(!payBeforeUnloadHandler) return;
  window.removeEventListener('beforeunload', payBeforeUnloadHandler);
  payBeforeUnloadHandler = null;
}

function showPayOverlay(){
  var el = $('payOverlay');
  if(!el){
    var div = document.createElement('div');
    div.id = 'payOverlay';
    div.className = 'payOverlay';
    div.setAttribute('role','dialog');
    div.setAttribute('aria-modal','true');
    div.innerHTML = ''
      + '<div class="payOverlayCard">'
      + '<div class="payOverlayBrand">'
      +   payOverlayLogoHtml()
      +   '<div class="payOverlayBrandText">'
      +     '<div class="payOverlayTitle">BILASPUR TEST SERIES</div>'
      +     '<div class="payOverlayTitleSub">Secure Admission</div>'
      +   '</div>'
      + '</div>'
      + '<div class="payOverlaySpinner"></div>'
      + '<div class="payOverlayStep" id="payOverlayStep">' + esc(PAY_OVERLAY_STEPS[0]) + '</div>'
      + '<div class="payOverlayBar"><span></span></div>'
      + '<div class="payOverlayHint"><b>Please do not close this page.</b><br>Secure Razorpay checkout is opening.</div>'
      + '<div class="payOverlayTrust"><span>&#x1F512; 256-bit SSL</span><span>&middot;</span><span>Razorpay Secured</span></div>'
      + '</div>';
    document.body.appendChild(div);
    el = div;
  }
  el.classList.remove('hide');
  document.body.style.overflow = 'hidden';
  payOverlayStepIdx = 0;
  if(payOverlayTimer) clearInterval(payOverlayTimer);
  payOverlayTimer = setInterval(function(){
    if(payOverlayStepIdx < PAY_OVERLAY_STEPS.length - 1) payOverlayStepIdx++;
    var stepEl = $('payOverlayStep');
    if(stepEl){
      stepEl.style.opacity = '0';
      setTimeout(function(){
        stepEl.innerHTML = esc(PAY_OVERLAY_STEPS[payOverlayStepIdx]);
        stepEl.style.opacity = '1';
      }, 180);
    }
  }, 2400);
  attachBeforeUnloadGuard();
}

function hidePayOverlay(){
  var el = $('payOverlay');
  if(el) el.classList.add('hide');
  document.body.style.overflow = '';
  if(payOverlayTimer){ clearInterval(payOverlayTimer); payOverlayTimer = null; }
}

    +   '<button class="paySecondary" type="button" id="payCopyBtn">Copy Admission ID</button>'
    + '</div>';

  var formCard = $('formCard');
  if(formCard){
    formCard.insertAdjacentHTML('afterend', html);
    formCard.style.display = 'none';
  } else {
    document.querySelector('.wrap').insertAdjacentHTML('afterbegin', html);
  }

  var copyBtn = $('payCopyBtn');
  if(copyBtn){
    copyBtn.onclick = function(){
      try{
        if(navigator.clipboard && navigator.clipboard.writeText){
          navigator.clipboard.writeText(String(res.admission_id || ''));
        } else {
          var ta = document.createElement('textarea');
          ta.value = String(res.admission_id || '');
          document.body.appendChild(ta); ta.select();
          try{ document.execCommand('copy'); }catch(e){}
          document.body.removeChild(ta);
        }
        copyBtn.innerHTML = '&#10003; Copied';
        setTimeout(function(){ copyBtn.innerHTML = 'Copy Admission ID'; }, 1800);
      }catch(e){}
    };
  }

  var ctaBtn = $('payCtaBtn');
  if(ctaBtn){
    ctaBtn.addEventListener('click', function(){
      // User has tapped pay. Safe to drop the reload-guard now.
      detachBeforeUnloadGuard();
      ctaBtn.style.animation = 'none';
      var sub = ctaBtn.nextElementSibling;
      if(sub) sub.innerHTML = 'Secure payment tab opened. Complete payment to unlock access.';
    });
  }

  try{
    var newCard = $('payReadyCard');
    if(newCard) newCard.scrollIntoView({behavior:'smooth', block:'start'});
  }catch(e){}
}

async function startRazorpayAdmission(){
  const btn=$('razorpayPayBtn');
  try{
    clearSubmitError();
    clearAllFieldErrors();
    if(!publicConfig || publicConfig.fallback || publicConfig.ok === false) throw {message:CONFIG_SLOW_MESSAGE};
    requireStudentField('name','Student name डालना जरूरी है.');
    if(!isValidIndianMobileInput(val('mobile'))) throw {message:'कृपया सही 10 digit mobile number डालें. Example: 9876543210', fieldId:'mobile'};
    requireStudentField('email','Email ID डालना जरूरी है.');
    if(!isValidEmailInput(val('email'))) throw {message:'Valid email ID डालें. Example: student@example.com', fieldId:'email'};
    requireStudentField('post','Varg / Post select करें.');
    requireStudentField('subject','Subject Group select करें.');
    requireStudentField('plan','Subscription Plan select करें.');

    // R3 ACCESS RETURN PATCH:
    // NO blank-tab popups, NO document.write, NO popup doc manipulation.
    // Full-screen overlay during the server call so the wait feels intentional,
    // beforeunload guard so reload/back is not accidental.
    // After success, the form is hidden and a clean pay-ready card is rendered.

    if(btn){btn.disabled=true; btn.dataset.oldText=btn.innerHTML; btn.innerHTML='<span class="spinner"></span> Processing...';}
    showPayOverlay();

    const payload={admissionCode:val('admissionCode'),name:val('name'),mobile:val('mobile'),email:val('email'),district:val('district'),post_id:val('post'),subject_id:val('subject'),plan_id:val('plan')};
    const raw=await callServerWithTimeout(60000,'createRazorpayAdmissionSafe', payload);
    const res=(typeof raw==='string')?JSON.parse(raw):raw;
    if(!res || res.ok===false){ throw {message:(res&&res.error)||'Razorpay Payment Link create failed.'}; }
    var payUrl = String(res.payment_url || '').trim();
    if(!/^https:\/\/(rzp\.io|razorpay\.com|pages\.razorpay\.com)\//i.test(payUrl)){
      throw {message:'Razorpay Payment Link invalid hai: '+payUrl};
    }

    hidePayOverlay();
    renderPayReadyCard(res, payUrl);

  }catch(err){
    hidePayOverlay();
    detachBeforeUnloadGuard();
    var em=normalizeClientError(err);
    showSubmitError(em, err && err.fieldId ? err.fieldId : '');
    showMsg('studentMsg', esc(em), 'error');
    if(btn){btn.disabled=false; btn.innerHTML=btn.dataset.oldText||'Pay Securely';}
  }
}

async function submitStudentForm(){
  if(isRazorpayEnabled()) return startRazorpayAdmission();
  const btn=$('submitBtn');
  try{
    clearSubmitError();
    clearAllFieldErrors();
    if(!publicConfig || publicConfig.fallback || publicConfig.ok === false) throw {message:CONFIG_SLOW_MESSAGE};
    requireStudentField('name','Student name डालना जरूरी है.');
    if(!isValidIndianMobileInput(val('mobile'))) throw {message:'कृपया सही 10 digit mobile number डालें. Example: 9876543210', fieldId:'mobile'};
    requireStudentField('post','Varg / Post select करें.');
    requireStudentField('subject','Subject Group select करें.');
    requireStudentField('plan','Subscription Plan select करें.');
    requireStudentField('utr','UTR / Transaction ID डालना जरूरी है.');
    const f=$('screenshot').files[0];
    if(!f) throw {message:'Payment screenshot/PDF upload करना जरूरी है.', fieldId:'screenshot'};
    if(!isAllowedProofFile(f)) throw {message:'Screenshot JPG/PNG/WEBP/PDF format me upload karein.', fieldId:'screenshot'};
    if(f.size>5*1024*1024) throw {message:'Screenshot/PDF 5 MB se chhota hona chahiye.', fieldId:'screenshot'};
    if(btn){
      btn.disabled=true;
      const oldText=btn.innerHTML;
      btn.dataset.oldText=oldText;
      btn.innerHTML='<span class="spinner"></span> Submit ho raha hai...';
    }
    showMsg('studentMsg','Form submit ho raha hai. Payment screenshot/PDF upload hone tak page band na karein.','');
    showSubmitProgress('Submit ho raha hai...', 'Payment screenshot/PDF upload ho raha hai. Thoda wait karein.');
    const b64=await readFileBase64(f);
    showSubmitProgress('Screenshot/PDF ready hai.', 'Admission request server par save ho raha hai. Page band na karein.');
    const payload={admissionCode:val('admissionCode'),name:val('name'),mobile:val('mobile'),district:val('district'),post_id:val('post'),subject_id:val('subject'),plan_id:val('plan'),utr:val('utr'),screenshotBase64:b64,screenshotName:f?f.name:'',screenshotMime:f?f.type:''};
    const raw=await callServerWithTimeout(90000,'submitAdmissionSafe', payload);
    const res=(typeof raw==='string')?JSON.parse(raw):raw;
    if(!res || res.ok===false){ throw {message:(res&&res.error)||'Admission submit failed. कृपया details check करके दोबारा try करें.'}; }
    $('formCard').innerHTML=`<div class="notice success"><h2>Admission Request Received</h2><p>${esc(res.message)}</p><p><b>Admission ID:</b> ${esc(res.admission_id)}</p><p class="muted">Is ID ko save kar lein.</p></div>`;
  }catch(err){
    var em=normalizeClientError(err);
    showSubmitError(em, err && err.fieldId ? err.fieldId : '');
    showMsg('studentMsg', esc(em), 'error');
    if(btn){btn.disabled=false; btn.innerHTML=btn.dataset.oldText||'Submit Admission Request';}
  }
}

  const adminLink = (studentLink.split('?')[0]) + '?page=admin';
  const defaultWarning = adminData.defaultAdminPasswordActive ? '<div class="notice error"><b>Default admin password active hai. Live se pehle password change karein.</b></div>' : '';
  $('adminBody').innerHTML=`${defaultWarning}<div class="card"><h2>Change Admin Password</h2><div id="passMsg" class="notice hide"></div><div class="row3"><div><label>Current Password</label><input id="curPass" type="password" placeholder="Current password"></div><div><label>New Password</label><input id="newPass" type="password" placeholder="Minimum 6 characters"></div><div><label>Confirm Password</label><input id="conPass" type="password" placeholder="Confirm new password"></div></div><button class="ok" onclick="changePassword()">Save Password</button><p class="muted">Password save hone ke baad code edit karne ki जरूरत नहीं पड़ेगी.</p></div><div class="card"><h2>Links & Health</h2><div id="healthBox" class="notice">Health check run nahi hua.</div><div class="row3"><button onclick="copyText('${esc(studentLink)}')">Copy Student Link</button><button class="secondary" onclick="copyText('${esc(adminLink)}')">Copy Admin Link</button><button class="secondary" onclick="checkHealth()">System Health</button></div><button class="warn" onclick="repairFolder()">Create/Repair Screenshot Folder</button><button class="secondary" onclick="adminLogout()">Logout / Forget this device</button><p class="muted">Agar screenshot folder delete ho gaya ho to Repair Screenshot Folder दबाएँ.</p></div>`;
}
async function changePassword(){
  try{
    const cur=val('curPass'), np=val('newPass'), cp=val('conPass');
    const r=await callServer('adminChangePassword',adminPassword,cur,np,cp);
    clearAdminRememberToken();
    adminPassword=np;
    adminData.defaultAdminPasswordActive=false;
    showMsg('passMsg',esc(r.message||'Password changed successfully.'),'success');
    $('curPass').value=''; $('newPass').value=''; $('conPass').value='';
  }catch(err){showMsg('passMsg',esc(err.message||err),'error')}
}
async function checkHealth(){
  try{
    const h=await callServer('adminGetSystemHealth',adminPassword);
    $('healthBox').className='notice success';
    $('healthBox').innerHTML=`Database: <b>${esc(h.database)}</b><br>Screenshot Folder: <b>${esc(h.screenshotFolder)}</b><br>${h.databaseUrl?`<a target="_blank" href="${esc(h.databaseUrl)}">Open Database</a><br>`:''}${h.screenshotFolderUrl?`<a target="_blank" href="${esc(h.screenshotFolderUrl)}">Open Screenshot Folder</a>`:''}`;
  }catch(err){showMsg('healthBox',esc(err.message||err),'error')}
}
async function repairFolder(){
  if(!confirm('New screenshot folder create/reconnect karna hai?')) return;
  try{const r=await callServer('adminRepairScreenshotFolder',adminPassword); $('healthBox').className='notice success'; $('healthBox').innerHTML='Screenshot folder ready: <a target="_blank" href="'+esc(r.folderUrl)+'">Open Folder</a>';}
  catch(err){showMsg('healthBox',esc(err.message||err),'error')}
}
async function copyText(text){
  try{await navigator.clipboard.writeText(text); showMsg('adminMsg','Link copied.','success')}
  catch(err){prompt('Copy this link:',text)}
}

function renderPaymentSettings(){
  const p=adminData.payment||{}, s=adminData.settings||{};
  $('adminBody').innerHTML=`
    <div class="card"><h2>Student Page</h2><p class="muted">Yahin se form title, logo, course details image aur support number manage करें.</p><div class="row"><div><label>Form Title</label><input id="set_FORM_TITLE" value="${esc(s.FORM_TITLE||'')}"></div><div><label>Support WhatsApp Number</label><input id="pay_SUPPORT_WHATSAPP" value="${esc(p.SUPPORT_WHATSAPP||'')}"></div></div><label>Logo Image URL</label><input id="set_LOGO_IMAGE_URL" value="${esc(s.LOGO_IMAGE_URL||s.LOGO_URL||'')}" placeholder="Public Drive/Image URL. Blank = BTS fallback"><label>Student Information Image URLs</label><textarea id="set_INFO_IMAGE_URLS" placeholder="One public image URL per line. Blank = no image.">${esc(s.INFO_IMAGE_URLS||'')}</textarea><div class="row3"><div><label>Form Status</label><select id="set_FORM_STATUS"><option ${s.FORM_STATUS==='OPEN'?'selected':''}>OPEN</option><option ${s.FORM_STATUS==='CLOSED'?'selected':''}>CLOSED</option></select></div><div><label>Duplicate Mobile Policy</label><select id="set_DUPLICATE_MOBILE_POLICY"><option ${s.DUPLICATE_MOBILE_POLICY==='BLOCK_SAME_PLAN'?'selected':''}>BLOCK_SAME_PLAN</option><option ${s.DUPLICATE_MOBILE_POLICY==='BLOCK'?'selected':''}>BLOCK</option><option ${s.DUPLICATE_MOBILE_POLICY==='ALLOW'?'selected':''}>ALLOW</option></select></div><div><label>Admission Code Required</label><select id="set_ADMISSION_CODE_REQUIRED"><option ${s.ADMISSION_CODE_REQUIRED==='NO'?'selected':''}>NO</option><option ${s.ADMISSION_CODE_REQUIRED==='YES'?'selected':''}>YES</option></select></div></div><details class="adminSection"><summary><span>Advanced / Legacy manual payment</span><span class="tiny">Normally not needed</span></summary><div class="adminSectionBody"><div class="row"><div><label>UPI ID</label><input id="pay_UPI_ID" value="${esc(p.UPI_ID||'')}"></div><div><label>Receiver Name</label><input id="pay_RECEIVER_NAME" value="${esc(p.RECEIVER_NAME||'')}"></div></div><label>QR Image URL</label><input id="pay_QR_IMAGE_URL" value="${esc(p.QR_IMAGE_URL||'')}"><div class="row"><div><label>Payment Note Prefix</label><input id="pay_PAYMENT_NOTE_PREFIX" value="${esc(p.PAYMENT_NOTE_PREFIX||'')}"></div><div><label>Admission Code</label><input id="set_ADMISSION_CODE" value="${esc(s.ADMISSION_CODE||'')}"></div></div></div></details><p><button id="savePaymentBtn" class="ok" onclick="saveConfig()">Save Student Page</button></p></div>
    <div class="card"><h2>Razorpay Status</h2><div class="adminHint">Provider: <b>${esc(p.PAYMENT_PROVIDER||'')}</b> · Enabled: <b>${esc(p.RAZORPAY_ENABLED||'')}</b> · Mode: <b>${esc(p.PAYMENT_MODE||'')}</b><br>Razorpay keys Script Properties me rahengi, yahan nahi.</div></div>`;
}

async function saveConfig(){
  const btn = $('savePaymentBtn');
  const oldText = btn ? btn.textContent : '';
  try{
    if(btn){btn.disabled=true; btn.textContent='Saving...';}
    const payment=Object.assign({}, adminData.payment || {});
    payment.UPI_ID=val('pay_UPI_ID') || payment.UPI_ID || '';
    payment.RECEIVER_NAME=val('pay_RECEIVER_NAME') || payment.RECEIVER_NAME || '';
    payment.QR_IMAGE_URL=val('pay_QR_IMAGE_URL') || payment.QR_IMAGE_URL || '';
    payment.PAYMENT_NOTE_PREFIX=val('pay_PAYMENT_NOTE_PREFIX') || payment.PAYMENT_NOTE_PREFIX || '';
    payment.SUPPORT_WHATSAPP=val('pay_SUPPORT_WHATSAPP') || payment.SUPPORT_WHATSAPP || '';
    // R3R1: preserve Razorpay keys when admin saves Setup/Payment settings.
    // Without these, adminSaveConfig() overwrites CONFIG_PAYMENT and Razorpay becomes disabled.
    payment.PAYMENT_PROVIDER=payment.PAYMENT_PROVIDER || 'RAZORPAY';
    payment.RAZORPAY_ENABLED=payment.RAZORPAY_ENABLED || 'TRUE';
    payment.PAYMENT_MODE=payment.PAYMENT_MODE || 'TEST';
    payment.SHOW_GROUP_LINK_AFTER_VERIFIED=payment.SHOW_GROUP_LINK_AFTER_VERIFIED || 'TRUE';
    const settings={FORM_TITLE:val('set_FORM_TITLE')||(adminData.settings||{}).FORM_TITLE||'BILASPUR TEST SERIES ADMISSION FORM',FORM_STATUS:val('set_FORM_STATUS')||(adminData.settings||{}).FORM_STATUS||'OPEN',ADMISSION_CODE_REQUIRED:val('set_ADMISSION_CODE_REQUIRED')||(adminData.settings||{}).ADMISSION_CODE_REQUIRED||'NO',ADMISSION_CODE:val('set_ADMISSION_CODE')||(adminData.settings||{}).ADMISSION_CODE||'AZAD2026',DUPLICATE_MOBILE_POLICY:val('set_DUPLICATE_MOBILE_POLICY')||(adminData.settings||{}).DUPLICATE_MOBILE_POLICY||'BLOCK',INFO_IMAGE_URLS:($('set_INFO_IMAGE_URLS')?val('set_INFO_IMAGE_URLS'):((adminData.settings||{}).INFO_IMAGE_URLS||'')),LOGO_IMAGE_URL:($('set_LOGO_IMAGE_URL')?val('set_LOGO_IMAGE_URL'):((adminData.settings||{}).LOGO_IMAGE_URL||''))};
    const data={posts:collectTable('posts'),subjects:collectTable('subjects'),plans:collectTable('plans'),links:collectTable('links'),payment,settings};
    await callServer('adminSaveConfig',adminPassword,data);
    showToast('Changes saved ✓','success');
    await refreshAdmin({silent:true});
    showToast('Saved and refreshed ✓','success');
  }
  catch(err){showMsg('adminMsg',esc(err.message||err),'error'); showToast('Save failed','error')}
  finally{if(btn){btn.disabled=false; btn.textContent=oldText || 'Save Payment/Settings';}}
}

document.addEventListener('DOMContentLoaded', function(){try{init();}catch(err){const app=document.getElementById('app'); if(app){app.innerHTML='<div class="card"><h1>BILASPUR TEST SERIES ADMISSION FORM</h1><div class="notice error">Page load error: '+esc(err.message||err)+'</div></div>';}}});
</script>
